<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Last Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a bright, candy-coloured street. HUD and menus are road-sign plates (golden yellow on deep indigo) docked to the screen edges; the hub has a dashed centre line running behind it. */
:root{
  --bg:#0f1745;
  --panel:#1b2766;
  --panel-2:#27368a;
  --line:#4658c4;
  --fg:#f6f8ff;
  --dim:#b3bff0;
  --sign:#ffc933;
  --sign-hi:#ffe88a;
  --sign-ink:#3a2300;
  --sign-edge:#b8760a;
  --hp:#ff5577;
  --xp:#3dffb0;
  --ice:#55dcff;
  --pink:#ff5fc0;
  --lime:#a6f23f;
  --violet:#a47bff;
  --common:#b9c4ea;
  --uncommon:#3dffb0;
  --rare:#58b4ff;
  --epic:#c98bff;
  --legend:#ffc933;
  --font-display:'Bungee','Impact','Arial Black',sans-serif;
  --font-ui:'Barlow Semi Condensed','Arial Narrow','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.25;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ic{width:1.35em;height:1.35em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.disp{font-family:var(--font-display);letter-spacing:.03em;font-weight:400}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{font-family:var(--font-display);font-size:15px;letter-spacing:.05em;background:linear-gradient(180deg,#ffe27a,var(--sign));color:var(--sign-ink);border:0;border-radius:8px;padding:12px 20px 11px;box-shadow:inset 0 0 0 2px var(--sign-hi),inset 0 0 0 3.5px var(--sign-ink),0 4px 0 var(--sign-edge);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--sign-hi),inset 0 0 0 3.5px var(--sign-ink),0 1px 0 var(--sign-edge)}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(.5)}
.btn.ghost{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 #0008}
.btn.ghost:active:not(:disabled){box-shadow:inset 0 0 0 1px var(--line),0 0 0 #0008}
.btn.sm{font-size:12px;padding:8px 12px 7px;min-height:36px;border-radius:7px}
.btn.big{font-size:20px;padding:16px 28px 14px;width:100%}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#0e1850cc;display:grid;place-items:center;color:var(--fg);padding:0}
.icon-btn .ic{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0e1850cc;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 9px;font-weight:700;font-size:15px}
.chip .ic{width:17px;height:17px}
.chip.gold{color:var(--sign)}
.chip.gem{color:var(--ice)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none}
.xpbar{position:relative;height:20px;background:#0b1345e6;border-bottom:1px solid #000}
.xpbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2fbf80,var(--xp));box-shadow:0 0 12px #5be3a088}
.xpbar b{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:0;height:100%;display:flex;align-items:center;font-family:var(--font-display);font-size:11px;font-weight:400;letter-spacing:.06em;color:#fff;text-shadow:0 1px 2px #000}
.hud-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding-top:8px;padding-bottom:0}
.hud-l{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.hud-r{display:flex;justify-content:flex-end;gap:8px}
.hud-r button{pointer-events:auto}
.plate{background:linear-gradient(180deg,#ffe27a,var(--sign));color:var(--sign-ink);font-family:var(--font-display);border-radius:7px;padding:6px 14px 5px;text-align:center;box-shadow:inset 0 0 0 2px var(--sign-hi),inset 0 0 0 3.5px var(--sign-ink),0 3px 0 #0009;min-width:116px}
.plate b{display:block;font-weight:400;font-size:14px;letter-spacing:.06em}
.plate span{display:block;font-size:12px;opacity:.8}
.skills{position:absolute;left:0;right:0;top:110px;display:flex;flex-direction:column;gap:5px}
.skrow{display:flex;gap:4px;flex-wrap:wrap}
.slot{position:relative;width:30px;height:30px;border-radius:7px;background:#0b1345d9;border:1px solid var(--line);display:grid;place-items:center}
.slot .ic{width:18px;height:18px}
.slot em{position:absolute;right:-3px;bottom:-4px;font-style:normal;font-family:var(--font-display);font-size:9px;background:#000;border-radius:5px;padding:1px 3px;color:var(--fg);line-height:1.1}
.slot.evo{border-color:var(--sign);box-shadow:0 0 10px #ffb52e88}
.slot.max em{color:var(--sign)}
.slot.empty{opacity:.3;border-style:dashed}
.bossbar{position:absolute;left:0;right:0;top:72px;display:grid;justify-items:center;gap:3px}
.bossbar[hidden]{display:none}
.bossbar .nm{font-family:var(--font-display);font-size:12px;letter-spacing:.08em;color:#fff;text-shadow:0 2px 3px #000}
.bossbar .bar{width:min(420px,100%);height:12px;background:#0b1345e6;border:1px solid #000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #ff5a4d66}
.bossbar .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b8261b,var(--hp))}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--font-display);font-size:clamp(26px,8vw,54px);color:var(--sign);text-shadow:0 3px 0 #000b,0 0 28px #ffb52e77;opacity:0;pointer-events:none;line-height:1.05;padding:0 16px}
#banner small{display:block;font-size:.38em;color:var(--fg);letter-spacing:.14em;margin-top:6px}
#banner.show{animation:ban 2.3s ease-out forwards}
#banner.red{color:var(--hp);text-shadow:0 3px 0 #000b,0 0 28px #ff5a4d88}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:#070b2ecc;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding-top:12px;padding-bottom:12px;overflow:auto}
#modal[hidden]{display:none}
.sheet{width:min(520px,100%);display:grid;gap:12px;margin:auto}
.sheet h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(24px,7vw,34px);text-align:center;color:var(--sign);text-shadow:0 3px 0 #000a;letter-spacing:.05em;text-wrap:balance}
.sheet h2.red{color:var(--hp)}
.sheet .sub{text-align:center;color:var(--dim);margin-top:-6px}
.cards{display:grid;gap:10px}
.card{position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 4px 0 #0009;animation:cardin .28s ease-out backwards}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
@keyframes cardin{from{opacity:0;transform:translateY(12px)}}
.card:hover,.card:focus-visible{border-color:var(--sign)}
.card:active{transform:translateY(2px);box-shadow:0 2px 0 #0009}
.card .ico{width:52px;height:52px;border-radius:12px;background:#0b1345;border:1px solid var(--line);display:grid;place-items:center}
.card .ico .ic{width:30px;height:30px}
.card .mt{display:grid;gap:2px;min-width:0}
.card .mt>b{font-size:19px;font-weight:700;line-height:1.1}
.card .mt small{color:var(--dim);font-size:14px;line-height:1.2}
.card .tag{font-family:var(--font-display);font-size:10px;letter-spacing:.08em;color:var(--xp)}
.card.new .tag{color:var(--ice)}
.card.evo{border-color:var(--sign);background:repeating-linear-gradient(135deg,#ffb52e1f 0 10px,transparent 10px 20px),linear-gradient(180deg,#2b2412,#1a1a14);box-shadow:0 0 22px #ffb52e44,0 4px 0 #0009}
.card.evo .tag{color:var(--sign)}
.card .lv{font-family:var(--font-display);font-size:12px;color:var(--dim);text-align:right;white-space:nowrap}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:12px;height:5px;border-radius:2px;background:#0b1345;border:1px solid var(--line)}
.pips i.on{background:var(--xp);border-color:var(--xp)}
.pips i.next{background:#fff;border-color:#fff;animation:blink .8s infinite alternate}
@keyframes blink{to{opacity:.25}}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stats div{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stats span{color:var(--dim)}
.stats b{font-variant-numeric:tabular-nums}
.build{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.reveal{display:grid;gap:8px}
.reveal .card{grid-template-columns:44px 1fr auto;padding:9px 12px}
.reveal .card .ico{width:44px;height:44px}
.reveal .card .ico .ic{width:26px;height:26px}
.reveal .card:not(.shown){visibility:hidden}
.crate{justify-self:center;width:84px;height:84px;color:var(--sign);animation:crate 1s ease-in-out infinite alternate}
.crate .ic{width:100%;height:100%;stroke-width:1.4}
@keyframes crate{from{transform:rotate(-4deg) scale(.96)}to{transform:rotate(4deg) scale(1.04)}}

/* ---------- hub ---------- */
#hub{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(80% 45% at 10% 0%,#ff5fc055 0%,transparent 65%),radial-gradient(80% 45% at 95% 8%,#55dcff4d 0%,transparent 65%),linear-gradient(180deg,#2a3590,#141e5c 55%,#0d1440)}
#hub[hidden]{display:none}
#hub::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:6px;margin-left:-3px;background:repeating-linear-gradient(180deg,#ffc93338 0 34px,transparent 34px 68px);pointer-events:none}
.topbar{position:relative;display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line);background:#0b1345e0}
.brand{font-family:var(--font-display);font-size:20px;color:var(--sign);letter-spacing:.05em;margin-right:auto;text-shadow:0 2px 0 #000}
.brand small{display:block;font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.18em;text-shadow:none}
#hub-body{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding-top:14px;padding-bottom:18px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.col{width:min(640px,100%);margin:0 auto;display:grid;gap:12px}
.col.fill{display:flex;flex-direction:column;min-height:100%}
.col.fill>.btn.big{margin-top:auto;position:sticky;bottom:0}
.startgap{flex:1 1 0;min-height:4px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;gap:6px;padding-top:8px;padding-bottom:calc(8px);background:#0b1345f2;border-top:1px solid var(--line)}
.tab{background:transparent;border:0;border-radius:10px;color:var(--dim);display:grid;justify-items:center;gap:2px;padding:7px 2px 5px;font-weight:700;font-size:13px;letter-spacing:.04em;min-height:52px}
.tab .ic{width:24px;height:24px}
.tab .ic{color:var(--tc,currentColor)}
.tab[aria-selected="true"]{color:var(--sign);background:#ffc93322;box-shadow:inset 0 2px 0 var(--sign)}
.tab.go{background:linear-gradient(180deg,#ffe27a,var(--sign));color:var(--sign-ink);box-shadow:inset 0 0 0 2px var(--sign-hi),inset 0 0 0 3.5px var(--sign-ink)}
.tab.go[aria-selected="true"]{background:var(--sign);box-shadow:inset 0 0 0 2px var(--sign-hi),inset 0 0 0 3.5px var(--sign-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.h3{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;color:var(--dim);margin:0 0 8px;font-weight:400}
.heroline{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.portrait{width:96px;height:96px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#6f7fe8,#222c80);border:1px solid var(--line);display:block}
.hl-t{display:grid;gap:4px}
.hl-t b{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.04em}
.power{display:inline-flex;gap:6px;align-items:baseline;font-weight:700;color:var(--sign)}
.power small{color:var(--dim);font-weight:600;letter-spacing:.1em;font-size:11px}
.chap{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.chap[aria-pressed="true"]{border-color:var(--sign);box-shadow:0 0 0 1px var(--sign) inset,0 0 18px #ffb52e22}
.chap:disabled{opacity:.5;cursor:default}
.chap .no{font-family:var(--font-display);font-size:22px;width:44px;height:44px;border-radius:9px;background:var(--cc,var(--sign));color:var(--sign-ink);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--sign-hi),inset 0 0 0 3px var(--sign-ink)}
.chap:disabled .no{background:#38428f;color:var(--dim);box-shadow:none}
.chap b{display:block;font-size:18px}
.chap small{color:var(--dim);font-size:13px}
.chap .rec{font-size:12px;color:var(--dim);text-align:right;line-height:1.2}
.chap .rec strong{display:block;color:var(--fg);font-size:15px}
.chap .ok{color:var(--xp);font-weight:700}
.gear{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tier,var(--common));border-radius:12px;padding:12px}
.g .top{display:flex;gap:10px;align-items:center}
.g .ico{width:46px;height:46px;border-radius:11px;background:#0b1345;border:1px solid var(--tier,var(--line));display:grid;place-items:center;color:var(--tier,var(--common));flex:none}
.g .ico .ic{width:28px;height:28px}
.g b{font-size:17px;display:block;line-height:1.1}
.g .lvl{font-family:var(--font-display);font-size:11px;color:var(--tier,var(--common))}
.g .st{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14px}
.g .st span{color:var(--dim)}
.g .st b{font-size:15px;display:inline}
.g .nx{color:var(--xp);font-size:12px}
.tal{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tal .ico{width:42px;height:42px;border-radius:10px;background:#0b1345;border:1px solid var(--line);display:grid;place-items:center;color:var(--sign)}
.tal b{display:block;font-size:17px;line-height:1.1}
.tal small{color:var(--dim);font-size:13px}
.tal .nx{color:var(--xp)}
.tal .meter{height:4px;background:#0b1345;border-radius:2px;margin-top:5px;overflow:hidden}
.tal .meter i{display:block;height:100%;background:var(--sign)}
.heroes{display:grid;gap:10px}
.hc{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hc.sel{border-color:var(--sign);box-shadow:0 0 0 1px var(--sign) inset}
.hc .portrait{width:72px;height:72px;border-radius:12px}
.hc b{font-family:var(--font-display);font-weight:400;font-size:18px;letter-spacing:.04em}
.hc small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.hc .wp{display:inline-flex;align-items:center;gap:5px;color:var(--fg);font-size:13px;margin-top:3px}
.note{color:var(--dim);font-size:13px;text-align:center}
.danger{color:var(--hp)}


/* ---------- colour accents ---------- */
.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));background:linear-gradient(180deg,color-mix(in srgb,var(--c,#ffc933) 24%,var(--panel-2)),color-mix(in srgb,var(--c,#ffc933) 6%,var(--panel)));border-color:var(--line);border-color:color-mix(in srgb,var(--c,#ffc933) 55%,var(--line))}
.card .ico{background:#0b1345;background:color-mix(in srgb,var(--c,#ffc933) 28%,#0b1345);border-color:color-mix(in srgb,var(--c,#ffc933) 70%,#0b1345)}
.card .mt>b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.pair b{font-size:inherit;font-weight:700;display:inline}
.fav{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-family:var(--font-display);font-weight:400;font-size:9px;letter-spacing:.08em;color:var(--sign-ink);background:linear-gradient(180deg,#ffe27a,var(--sign));border-radius:999px;padding:3px 7px 2px;box-shadow:0 0 10px #ffc93388;line-height:1}
.fav .ic{width:10px;height:10px;fill:currentColor;stroke:none}
.fav.field{background:linear-gradient(180deg,#a8f2ff,var(--ice));box-shadow:0 0 10px #55dcff88}
.pair{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;font-weight:600;color:var(--dim);line-height:1.2}
.pair .ic{width:15px;height:15px}
.pair.have{color:var(--xp)}
.top5{display:grid;gap:10px}
.top5 .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:linear-gradient(90deg,#ff5fc040,#a47bff40,#55dcff40);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.top5 .hd b{display:block;font-family:var(--font-display);font-weight:400;font-size:14px;letter-spacing:.06em}
.top5 .hd small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.top5 .hd .ic{transition:transform .15s}
.top5 .hd[aria-expanded="true"] .ic{transform:rotate(180deg)}
.t5col{display:grid;gap:6px}
.t5row{display:grid;grid-template-columns:22px 38px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.t5row .rk{font-family:var(--font-display);font-size:16px;color:var(--sign);text-align:center}
.t5row .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#0b1345;background:color-mix(in srgb,var(--c) 28%,#0b1345);border:1px solid color-mix(in srgb,var(--c) 60%,#0b1345)}
.t5row .ico .ic{width:22px;height:22px}
.t5row b{display:block;font-size:16px;line-height:1.1}
.t5row small{color:var(--dim);font-size:13px;line-height:1.2}

/* ---------- mini map ---------- */
.mm{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:112px;width:100px;height:100px;border-radius:50%;filter:drop-shadow(0 3px 0 #0008);pointer-events:none}

/* ---------- levels ---------- */
.map{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:12px;padding:10px 10px 10px 12px;display:grid;gap:9px}
.map.locked{opacity:.55}
.map .mh{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.map .no{font-family:var(--font-display);font-size:18px;width:34px;height:34px;border-radius:8px;background:var(--cc);color:var(--sign-ink);display:grid;place-items:center;box-shadow:inset 0 0 0 2px #fff7,inset 0 0 0 3px var(--sign-ink)}
.map .mn b{display:block;font-size:17px;line-height:1.1}
.map .mn small{display:block;color:var(--dim);font-size:12.5px;line-height:1.2;margin-top:1px}
.map .mp{font-family:var(--font-display);font-size:12px;color:var(--dim)}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvl{display:grid;gap:1px;justify-items:center;align-content:center;text-align:center;background:#0f1a56;border:1px solid var(--line);border-top:3px solid var(--tt);border-radius:10px;padding:7px 4px 6px;min-height:64px}

/* Rebirth (prestige): clear Level 15, reset level progress and gold, keep gear. Each rank = permanent power + tougher zombies + bigger rewards. */
const RB_MAX=10,RB_NEED=15;
const rbHpMul=r=>1+0.35*r,rbDmgMul=r=>1+0.2*r,rbRewMul=r=>1+0.5*r;
const RB_PER={dmg:0.12,hp:0.12,gold:0.10};
const SKEY='lastlight.save.v1';   /* same key as before; the data inside is versioned (v:2) and old saves are migrated */
function defaultSave(){
  const talents={};TALENTS.forEach(t=>talents[t.id]=0);
  return {v:2,rebirth:0,gold:400,gems:60,hero:'juno',heroes:{juno:1},inv:{},eq:{},pity:{scrap:0,vanguard:0,prime:0},free:{scrap:3,vanguard:0,prime:0},talents,stages:{},mute:false,opened:0,note:'Welcome! Three free Scrap Crates are waiting in the Shop.'};
}
/* v1 -> v2: old gold-levelled gear is refunded as gold, old chapters 1/2/3 count as levels 1/4/7 */
const OLD_GEAR_COST=l=>Math.round(25*Math.pow(l,1.45));
function migrateV1(s){
  const d=defaultSave();
  let refund=0;
  if(s.gear)for(const k in s.gear){const L=Math.max(1,Math.min(40,s.gear[k]|0));for(let l=1;l<L;l++)refund+=OLD_GEAR_COST(l)}
  d.gold=(s.gold|0)+refund;d.gems=s.gems|0;
  d.hero=HEROES[s.hero]?s.hero:'juno';d.heroes=Object.assign({juno:1},s.heroes||{});
  d.talents=Object.assign(d.talents,s.talents||{});d.mute=!!s.mute;
  d.stages={};
  const old=s.stages||{},to=[1,4,7];
  for(let k=1;k<=3;k++){
    const o=old[k];if(!o)continue;
    const id=to[k-1];d.stages[id]=Object.assign({},o);
    if(o.clear)for(let j=1;j<id;j++)d.stages[j]=Object.assign({clear:1},d.stages[j]||{});
  }
  d.note=refund>0?'Your old gear was refunded as '+refund.toLocaleString()+' gold. Armor now comes from crates - three free Scrap Crates are waiting in the Shop.':'Armor now comes from crates. Three free Scrap Crates are waiting in the Shop.';
  return d;
}
function loadSave(){
  const d=defaultSave();
  try{
    const raw=localStorage.getItem(SKEY);
    if(raw){
      const s=JSON.parse(raw);
      if(s&&s.v===1)return migrateV1(s);
      if(s&&s.v===2){
        Object.assign(d,s);
        d.talents=Object.assign(defaultSave().talents,s.talents||{});
        d.heroes=Object.assign({juno:1},s.heroes||{});
        d.inv=s.inv||{};d.eq=s.eq||{};d.stages=s.stages||{};
        d.pity=Object.assign(defaultSave().pity,s.pity||{});d.free=Object.assign(defaultSave().free,s.free||{});
        if(!HEROES[d.hero])d.hero='juno';
        d.rebirth=Math.max(0,Math.min(RB_MAX,s.rebirth|0));
        d.note=s.note||'';
      }
    }
  }catch(e){}
  return d;
}
let SAVE=loadSave();
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}}

/* equipped item of a slot: {slot,r,l} or null */
function equipped(slot){
  const r=SAVE.eq[slot];if(r===undefined||r===null)return null;
  const l=SAVE.inv[slot+r];return l?{slot,r,l}:null;
}
/* put one found item in the collection. A duplicate levels the item up; a maxed duplicate pays gold. */
function grantArmor(slot,r){
  const key=slot+r,had=SAVE.inv[key]||0,out={slot,r,isNew:!had,level:had||1,maxed:false,gold:0,equipped:false};
  if(!had)SAVE.inv[key]=1;
  else if(had<ARMOR_MAX){SAVE.inv[key]=had+1;out.level=had+1}
  else{out.maxed=true;out.gold=DUPE_GOLD[r];SAVE.gold+=out.gold}
  const cur=equipped(slot);
  if(!cur||armorValue(r,SAVE.inv[key])>armorValue(cur.r,cur.l)+1e-9){SAVE.eq[slot]=r;out.equipped=true}
  return out;
}
/* roll one crate (does not charge). rng is injectable for tests. */
function rollCrate(C,rng){
  rng=rng||Math.random;
  const pityHit=!!(C.pity&&(SAVE.pity[C.id]||0)>=C.pity.n-1);
  let tot=0;for(const o of C.odds)tot+=o;
  let x=rng()*tot,r=0;
  for(let i=0;i<C.odds.length;i++){x-=C.odds[i];if(x<0){r=i;break}}
  let forced=false;
  if(pityHit&&r<C.pity.r){r=C.pity.r;forced=true}
  const slot=SLOTS[Math.floor(rng()*SLOTS.length)].id;
  if(C.pity)SAVE.pity[C.id]=r>=C.pity.r?0:(SAVE.pity[C.id]||0)+1;
  return {slot,r,forced};
}
/* pay for and open a crate. use 'free' crates first. Returns the drop or null when it cannot be paid. */
function openCrate(id,rng){
  const C=CASE_BY[id];if(!C)return null;
  if(SAVE.free[id]>0)SAVE.free[id]--;
  else if(C.cur==='gold'&&SAVE.gold>=C.cost)SAVE.gold-=C.cost;
  else if(C.cur==='gems'&&SAVE.gems>=C.cost)SAVE.gems-=C.cost;
  else return null;
  const d=rollCrate(C,rng),g=grantArmor(d.slot,d.r);
  SAVE.opened=(SAVE.opened||0)+1;persist();
  return Object.assign(g,{crate:id,forced:d.forced});
}
const canOpen=id=>{const C=CASE_BY[id];return SAVE.free[id]>0||(C.cur==='gold'?SAVE.gold>=C.cost:SAVE.gems>=C.cost)};

/* base stat bundle from permanent progression (armor + talents + hero) */
function metaStats(){
  const s={dmg:0,hp:0,regen:0,cdr:0,area:0,pspd:0,spd:0,magnet:0,armor:0,crit:0,critMul:0,xp:0,gold:0,proj:0,pierce:0,dur:0,fire:0};
  for(const sl of SLOTS){const it=equipped(sl.id);if(it)for(const st of armorStats(sl.id,it.r,it.l))s[st.k]+=st.v}
  TALENTS.forEach(t=>t.apply(SAVE.talents[t.id]||0,s));
  const h=HEROES[SAVE.hero].add;for(const k in h)s[k]+=h[k];
  const rb=SAVE.rebirth|0;if(rb>0){s.dmg+=RB_PER.dmg*rb;s.hp+=RB_PER.hp*rb;s.gold+=RB_PER.gold*rb}
  return s;
}
/* what a level asks for once zombies have been toughened by rebirth */
function recPower(st){const r=SAVE.rebirth|0;return r?Math.round(st.power*Math.pow(rbHpMul(r)*rbDmgMul(r),0.7)/10)*10:st.power}
function powerOf(){
  const s=metaStats();
  return Math.round((120*(1+s.hp)/6)*(1+s.dmg)*(1+Math.min(75,s.armor)/100)*(1+s.crit*0.8)*(1+s.cdr)*5);
}

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null;const sfxT={};let gemPitch=0,gemAt=0;
function ensureAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume()}catch(e){}}return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.22;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function tone(f,dur,type,vol,slide,delay){
  if(!AC||SAVE.mute)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+dur);
  g.gain.setValueAtTime(vol||0.15,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);
}
function noise(dur,vol,freq){
  if(!AC||SAVE.mute||!noiseBuf)return;
  const t0=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq||900;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur);
}
const SFX_GAP={shoot:60,hit:50,gem:18,hurt:120,boom:90,kill:40,bolt:80,tick:25};
function sfx(n){
  if(G&&G.net==='host')netSfx(n);
  if(!AC||SAVE.mute)return;
  const now=performance.now(),gap=SFX_GAP[n]||0;
  if(gap&&sfxT[n]&&now-sfxT[n]<gap)return;sfxT[n]=now;
  switch(n){
    case 'shoot':tone(520,0.05,'square',0.03,-200);break;
    case 'hit':tone(180,0.04,'square',0.04,-60);break;
    case 'kill':tone(300,0.06,'triangle',0.05,-150);break;
    case 'gem':{if(now-gemAt>350)gemPitch=0;gemAt=now;gemPitch=Math.min(gemPitch+1,12);tone(520+gemPitch*38,0.06,'sine',0.07);break}
    case 'coin':tone(1100,0.05,'square',0.05);tone(1500,0.08,'square',0.05,0,0.05);break;
    case 'hurt':tone(140,0.16,'sawtooth',0.12,-80);noise(0.1,0.1,600);break;
    case 'boom':noise(0.35,0.28,700);tone(90,0.25,'sine',0.2,-50);break;
    case 'bolt':noise(0.12,0.12,3500);tone(900,0.1,'sawtooth',0.05,-600);break;
    case 'nova':tone(700,0.35,'sine',0.1,-500);break;
    case 'level':[523,659,784,1047].forEach((f,i)=>tone(f,0.14,'square',0.07,0,i*0.07));break;
    case 'up':tone(660,0.1,'square',0.07);tone(990,0.14,'square',0.07,0,0.08);break;
    case 'evolve':[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,0.2,'sawtooth',0.07,0,i*0.08));break;
    case 'chest':[600,800,1000,1300].forEach((f,i)=>tone(f,0.12,'triangle',0.09,0,i*0.06));break;
    case 'warn':tone(220,0.35,'sawtooth',0.12,0);tone(220,0.35,'sawtooth',0.12,0,0.45);break;
    case 'wave':tone(330,0.18,'triangle',0.1);tone(440,0.25,'triangle',0.1,0,0.14);break;
    case 'click':tone(800,0.04,'square',0.05);break;
    case 'tick':tone(1250+Math.random()*120,0.022,'square',0.035);break;
    case 'die':tone(300,0.6,'sawtooth',0.15,-250);break;
  }
}

/* ---------- input ---------- */
const input={keys:{},joy:null,joy2:null};
function clearJoy(){input.joy=null;input.joy2=null}
function canvasPos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
  if(state!=='run'||!G||G.paused)return;
  ensureAudio();const[x,y]=canvasPos(e);
  const key=(G.split&&x>cv.getBoundingClientRect().width/2)?'joy2':'joy';
  if(input[key])return;
  input[key]={id:e.pointerId,bx:x,by:y,x,y};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  const j=[input.joy,input.joy2].find(q=>q&&q.id===e.pointerId);if(!j)return;
  const[x,y]=canvasPos(e);j.x=x;j.y=y;
  const dx=x-j.bx,dy=y-j.by,d=Math.hypot(dx,dy),R=54;
  if(d>R){j.bx+=dx/d*(d-R);j.by+=dy/d*(d-R)}
  e.preventDefault();
});
const endJoy=e=>{if(input.joy&&input.joy.id===e.pointerId)input.joy=null;if(input.joy2&&input.joy2.id===e.pointerId)input.joy2=null};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);cv.addEventListener('lostpointercapture',endJoy);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();input.keys[k]=1;
  if(state==='run'&&G){
    if((k==='escape'||k==='p')&&!G.paused){pauseGame();e.preventDefault()}
    else if(G.paused&&G.opts&&!$('#modal').hidden){
      if(k==='1'||k==='2'||k==='3'){const i=+k-1;if(G.opts[i])pickOption(i)}
      else if(k==='r')doRefresh();
    }
  }
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)&&state==='run')e.preventDefault();
});
window.addEventListener('keyup',e=>{input.keys[e.key.toLowerCase()]=0});
window.addEventListener('blur',()=>{input.keys={};if(state==='run'&&G&&!G.paused&&G.net!=='guest')pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run'&&G&&!G.paused&&G.net!=='guest')pauseGame()});
function readMove(w){

function weaponDiff(id,l){

function buildOptions(n){

function pickType(){

  if(w>=4)W.push(['spitter',5+2*w]);

function spawnDirector(dt){

    }
  }else G.spawnT=0.15;
  G.batT-=dt;
  if(w>=2&&G.batT<=0&&E.length<cap+40){
    G.batT=Math.max(8,rnd(17,26)-w);

    const tx=CAMP.x,ty=CAMP.y;

      const ox=Math.cos(a)*R+rnd(-60,60)-Math.sin(a)*(i-n/2)*20,oy=Math.sin(a)*R+rnd(-60,60)+Math.cos(a)*(i-n/2)*20;

    }

    for(let i=0;i<n;i++){const a=i/n*TAU;mkEnemy('walker',CAMP.x+Math.cos(a)*R,CAMP.y+Math.sin(a)*R)}
    banner('SURROUNDED','',true);
  }
}

/* ---------- spatial grid for crowd separation ---------- */
const GN=56,CELL=48,gHead=new Int32Array(GN*GN),gNext=new Int32Array(1024);let gOX=0,gOY=0;
function gridBuild(){
  gHead.fill(-1);gOX=CAMP.x-GN*CELL/2;gOY=CAMP.y-GN*CELL/2;
  const n=Math.min(E.length,1024);
  for(let i=0;i<n;i++){
    const e=E[i],gx=((e.x-gOX)/CELL)|0,gy=((e.y-gOY)/CELL)|0;
    if(gx<0||gy<0||gx>=GN||gy>=GN){gNext[i]=-1;continue}
    const c=gy*GN+gx;gNext[i]=gHead[c];gHead[c]=i;
  }
}
function separate(e,i){
  if(e.k==='boss'||e.k==='elite'||i>=1024)return;
  const gx=((e.x-gOX)/CELL)|0,gy=((e.y-gOY)/CELL)|0;
  if(gx<1||gy<1||gx>=GN-1||gy>=GN-1)return;
  for(let cy=gy-1;cy<=gy+1;cy++)for(let cx=gx-1;cx<=gx+1;cx++){
    let j=gHead[cy*GN+cx];
    while(j!==-1){
      if(j!==i){
        const o=E[j],ox=e.x-o.x,oy=e.y-o.y,rr=(e.r+o.r)*0.92,d2=ox*ox+oy*oy;
        if(d2<rr*rr&&d2>0.0001){const dd=Math.sqrt(d2),push=(rr-dd)*0.4*(o.r/(e.r+o.r))*2;e.x+=ox/dd*push;e.y+=oy/dd*push}
      }
      j=gNext[j];
    }
  }
}

/* ---------- enemy update ---------- */
let _vx=0,_vy=0;
function bossAI(e,dt,d,nx,ny){
  const C=BOSSES[e.boss];
  e.tSlam-=dt;e.tDash-=dt;e.tSum-=dt;e.tShot-=dt;e.tFan-=dt;
  /* attacks are slow and telegraphed: long gaps, longer warnings, smaller circles and bullets */
  if(e.dashT>0){e.dashT-=dt;_vx=e.dx*e.spd*4.2;_vy=e.dy*e.spd*4.2;return}
  if(e.windup>0){e.windup-=dt;_vx=_vy=0;if(e.windup<=0)e.dashT=0.7;return}
  _vx=nx*e.spd;_vy=ny*e.spd;
  if(C.slam&&e.tSlam<=0){e.tSlam=C.slam;TZ.push({x:nearBody(e.x,e.y).x,y:nearBody(e.x,e.y).y,r:C.slamR,t:1.15,max:1.15,dmg:e.dmg*1.15})}
  if(C.dash&&e.tDash<=0&&d<480){e.tDash=C.dash;e.windup=0.9;e.dx=nx;e.dy=ny;sfx('warn')}
  if(C.shot&&e.tShot<=0){
    e.tShot=C.shot;const n=C.shotN||10,off=Math.random()*TAU;
    if(EB.length<200)for(let i=0;i<n;i++){const a=off+i/n*TAU;EB.push({x:e.x,y:e.y,vx:Math.cos(a)*135,vy:Math.sin(a)*135,r:5,dmg:e.dmg*0.5,life:3.6,col:'#ff8a4d'})}
  }
  if(C.fan&&e.tFan<=0){
    e.tFan=C.fan;const a0=Math.atan2(ny,nx);
    if(EB.length<200)for(let i=-2;i<=2;i++){const a=a0+i*0.2;EB.push({x:e.x,y:e.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,r:5,dmg:e.dmg*0.5,life:3.2,col:'#ff7ac8'})}
  }
  if(C.sum&&e.tSum<=0){
    e.tSum=C.sum;
    if(e.boss==='matron'){for(let i=0;i<6;i++){const a=i/6*TAU,b=mkEnemy('bat',e.x+Math.cos(a)*50,e.y+Math.sin(a)*50);b.hx=nx;b.hy=ny}}
    else for(let i=0;i<6;i++){const a=i/6*TAU;mkEnemy(Math.random()<0.3?'runner':'walker',e.x+Math.cos(a)*(e.r+22),e.y+Math.sin(a)*(e.r+22))}
  }
}
function updateEnemies(dt){
  let n=0;for(let i=0;i<E.length;i++){const e=E[i];if(!e.dead)E[n++]=e}E.length=n;
  gridBuild();
  const far=Math.hypot(HVW,HVH)+520;
  for(let i=0;i<E.length;i++){
    const e=E[i];if(e.dead)continue;
    e.t+=dt;
    if(e.flash>0)e.flash-=dt;
    if(e.orbT>0)e.orbT-=dt;
    if(e.ballT>0)e.ballT-=dt;
    if(e.sear>0)e.sear-=dt;
    if(e.chr>0)e.chr-=dt;
    if(e.burn>0){e.burn-=dt;e.burnT-=dt;if(e.burnT<=0){e.burnT+=0.5;hurt(e,e.burnDps*0.5,{noCrit:1,nf:1});if(e.dead)continue}}
    let mul=1;
    if(e.freeze>0){e.freeze-=dt;mul=0}else if(e.stun>0){e.stun-=dt;mul=0}else if(e.slow>0){e.slow-=dt;mul=e.slowF}
    if(e.tf<1){mul*=e.tf;e.tf=1}
    const tb=nearBody(e.x,e.y),px=tb.x,py=tb.y;
    const dx=px-e.x,dy=py-e.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;e.a=Math.atan2(dy,dx);
    if(d>far&&e.k!=='boss'){
      if(e.k==='bat'){e.dead=true;continue}
      const sp=spawnPos();e.x=sp[0];e.y=sp[1];continue;
    }
    _vx=nx*e.spd;_vy=ny*e.spd;
    switch(e.k){
      case 'bat':{
        e.hx+=(nx-e.hx)*dt*0.9;e.hy+=(ny-e.hy)*dt*0.9;const m=Math.hypot(e.hx,e.hy)||1;e.hx/=m;e.hy/=m;
        const w=Math.sin(e.t*6+e.id)*0.5;_vx=(e.hx-e.hy*w)*e.spd;_vy=(e.hy+e.hx*w)*e.spd;break;
      }
      case 'spitter':{
        const want=d>210?1:d<150?-0.8:0.05;_vx=nx*e.spd*want-ny*e.spd*0.3;_vy=ny*e.spd*want+nx*e.spd*0.3;
        e.tShot-=dt;if(e.tShot<=0&&d<360){e.tShot=2.5;EB.push({x:e.x,y:e.y,vx:nx*165,vy:ny*165,r:6,dmg:e.dmg,life:3.2,col:'#7dff3a'})}
        break;
      }
      case 'elite':{
        e.tDash-=dt;
        if(e.dashT>0){e.dashT-=dt;_vx=e.dx*e.spd*4.6;_vy=e.dy*e.spd*4.6}
        else if(e.windup>0){e.windup-=dt;_vx=_vy=0;if(e.windup<=0)e.dashT=0.6}
        else if(e.tDash<=0&&d<380){e.tDash=rnd(4.5,6.5);e.windup=0.55;e.dx=nx;e.dy=ny}
        break;
      }
      case 'boss':bossAI(e,dt,d,nx,ny);break;
    }
    e.x+=(_vx*mul+e.kx)*dt;e.y+=(_vy*mul+e.ky)*dt;
    const kd=Math.min(1,dt*7);e.kx-=e.kx*kd;e.ky-=e.ky*kd;
    if(e.k!=='bat')separate(e,i);
    // contact
    const cd=(e.k==='boss'?e.r*0.78:e.r)+P.r*0.85;
    if(d<cd+4){
      if(e.k==='bomber'){
        e.dead=true;G.kills++;ring(e.x,e.y,64,'#ff9a4d',0.3);burst(e.x,e.y,'#ffb066',14);sfx('boom');shake(4);
        if(d<64+P.r)hurtPlayer(e.dmg,0.5,tb);
        dropGem(e.x,e.y,e.xp);
      }else if(tb.inv<=0&&d<cd)hurtPlayer(e.dmg,e.k==='boss'?0.6:0.4,tb);
    }
  }
}

      const a=base+(i?rnd(-2.6,2.6):0),sp=s.spd*P.pspd;

  block(w,s,dt){

        if(n>bc){bc=n;best=c}
      }
      if(!best)continue;
      LOB.push({kind:'block',sx:P.x,sy:P.y,tx:best.x+rnd(-10,10),ty:best.y+rnd(-10,10),x:P.x,y:P.y,h:0,t:-i*0.2,dur:s.anvil?0.55:0.65,dmg:s.dmg*P.dmg,rad:R,stun:s.stun*(1+P.dur),anvil:!!s.anvil});
    }

  },
  /* ---- forcefields ---- */
  rebound(w,s,dt){
    const R=s.rad*P.area,dm=s.dmg*P.dmg,lock=s.cd*P.cdMul;
    w.rip=w.rip||[];w.pulse=(w.pulse||0)+dt;
    for(let i=w.rip.length-1;i>=0;i--){w.rip[i].t-=dt;if(w.rip[i].t<=0){w.rip[i]=w.rip[w.rip.length-1];w.rip.pop()}}
    for(let i=0;i<E.length;i++){
      const e=E[i];if(e.dead)continue;
      if(e.rbT>0){e.rbT-=dt;continue}
      const dx=e.x-P.x,dy=e.y-P.y,rr=R+e.r*0.4;
      if(dx*dx+dy*dy<rr*rr){
        const d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
        e.rbT=lock;
        hurt(e,dm,{kb:s.push,nx,ny,nf:Math.random()<0.5});
        if(e.dead)continue;
        if(s.stun&&e.k!=='boss')e.stun=Math.max(e.stun||0,s.stun*(1+P.dur));
        if(w.rip.length<14)w.rip.push({a:Math.atan2(dy,dx),t:0.4});
        if(FX.length<380)burst(P.x+nx*R,P.y+ny*R,w.evo?'#e6fbff':'#8ff0ff',3);
      }
    }
    if(s.reflect){
      for(let i=EB.length-1;i>=0;i--){
        const b=EB[i],dx=b.x-P.x,dy=b.y-P.y,rr=R+b.r;
        if(dx*dx+dy*dy<rr*rr){
          const d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,sp=Math.max(340,Math.hypot(b.vx,b.vy)*1.8)*P.pspd;
          if(B.length<420)B.push({x:b.x,y:b.y,vx:nx*sp,vy:ny*sp,nx,ny,r:b.r+1.5,dmg:Math.max(dm*1.5,b.dmg)*(s.rmul||1),pl:1+P.pierce,life:1.2,kind:'refl',col:w.evo?'#e6fbff':'#8ff0ff',hit:[],a:Math.atan2(ny,nx)});
          if(w.rip.length<14)w.rip.push({a:Math.atan2(dy,dx),t:0.4});
          burst(b.x,b.y,'#8ff0ff',4);sfx('hit');
          EB[i]=EB[EB.length-1];EB.pop();
        }

    }
  },
  scorch(w,s,dt){

    if((w.t-=dt)>0)return;
    const R=s.rad*P.area,dm=s.dmg*P.dmg*(1+P.fire);
    w.t=s.tick*P.cdMul;
    for(let i=0;i<E.length;i++){
      const e=E[i];if(e.dead)continue;
      const dx=e.x-P.x,dy=e.y-P.y,rr=R+e.r*0.5;
      if(dx*dx+dy*dy<rr*rr){
        hurt(e,dm,{noCrit:1,nf:Math.random()<0.6});
        if(e.dead)continue;
        e.sear=0.5;
        if(s.afterburn){e.burn=Math.max(e.burn,2.2*(1+P.dur));e.burnDps=Math.max(e.burnDps,dm*1.3)}
      }
    }
  },
  chrono(w,s,dt){
    const R=s.rad*P.area,keep=1-s.slow,keepB=1-Math.min(0.92,s.slow+(s.freeze?0.14:0.06));let inside=0;
    w.rot=(w.rot||0)+dt*(0.8+(w.on?1.6:0));
    for(let i=0;i<E.length;i++){
      const e=E[i];if(e.dead)continue;
      if(e.fzT>0)e.fzT-=dt;
      const dx=e.x-P.x,dy=e.y-P.y,rr=R+e.r*0.5;
      if(dx*dx+dy*dy<rr*rr){
        inside++;
        e.tf=e.k==='boss'?Math.max(keep,0.6):keep;e.chr=0.2;
        if(s.freeze&&e.k!=='boss'&&!(e.fzT>0)){e.freeze=Math.max(e.freeze,s.freeze*(1+P.dur));e.fzT=4.5}
      }
    }
    /* enemy bullets that drift into the bubble slow down too (nearly stop under Stasis) */
    for(let i=0;i<EB.length;i++){
      const b=EB[i],dx=b.x-P.x,dy=b.y-P.y,rr=R+b.r;
      if(dx*dx+dy*dy<rr*rr){b.tf=Math.min(b.tf<1?b.tf:1,keepB);b.chr=0.2}
    }
    w.on=inside>0;
    if(w.on)P.haste=Math.min(0.85,s.haste);
  }
};

/* ---------- main update ---------- */
function update(dt){
  const st=G.stage;
  G.t+=dt;G.waveT+=dt;
  if(G.waveT>=st.waveLen&&G.wave<st.waves){G.wave++;G.waveT=0;onWaveStart()}
  // player
  if(G.hurtFx>0)G.hurtFx-=dt;
  { const[ax,ay]=readMove(0);stepBody(P,ax,ay,dt);
    if(G.co){for(let i=1;i<nPl();i++){const m1=G.net==='host'?(NETIN.ms[i]||[0,0]):readMove(1);stepBody(PL[i],m1[0],m1[1],dt)}tether();reviveCheck(dt)} }
  updateCam();
  if(!G.won)spawnDirector(dt);
  updateWeapons(dt);
  updateEnemies(dt);
  updateBullets(dt);updateDiscs(dt);updateBalls(dt);updateLobs(dt);updateZones(dt);updatePickups(dt);updateFx(dt);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*28);
  if(G.flash>0)G.flash-=dt;
  if(G.won){G.winT-=dt;if(G.winT<=0&&!G.dead){G.dead=true;G.paused=true;showResult(true)}}
}

function rollChestItem(){
  let o=null;
  const ev=SK.act.find(canEvolve);
  if(ev)o={t:'evo',id:ev.id};
  else{
    const ups=[];
    for(const w of SK.act)if(w.l<MAXW)ups.push({t:'up',k:'act',id:w.id});
    for(const p of SK.pas)if(p.l<passMax(p.id))ups.push({t:'up',k:'pas',id:p.id});
    if(ups.length)o=pick(ups);
    else{
      const nw=[];
      if(SK.act.length<6)for(const id in WEAPONS)if(!ownedAct(id))nw.push({t:'new',k:'act',id});
      if(SK.pas.length<6)for(const id in PASSIVES)if(!ownedPas(id))nw.push({t:'new',k:'pas',id});
      o=nw.length?pick(nw):{t:Math.random()<0.5?'heal':'gold'};
    }
  }
  const d=describe(o);applyOption(o);return d;
}
function openChest(tier){
  G.paused=true;G.chestOpen=true;clearJoy();

      ctx.fillStyle='rgba(255,181,46,'+(0.12+0.16*pu)+')';ctx.beginPath();ctx.arc(p.x,p.y,30+pu*4,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,210,122,'+(0.1+0.08*pu)+')';ctx.fillRect(p.x-4,p.y-150,8,150);
      ctx.fillStyle='#d98a1a';ctx.fillRect(p.x-12,p.y-9,24,18);
      ctx.fillStyle='#ffb52e';ctx.fillRect(p.x-12,p.y-9,24,7);
      ctx.fillStyle='#2b1b00';ctx.fillRect(p.x-12,p.y-3,24,2);ctx.fillRect(p.x-2,p.y-9,4,18);
      if(p.tier>=2){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(p.x-14,p.y-11,28,22)}
    }
  }
  drawFields(0);
  // lobbed items
  for(const l of LOB){
    if(l.t<0)continue;
    if(l.anvil){const kk=Math.min(1,l.t/l.dur);ctx.fillStyle='rgba(60,20,110,'+(0.12+0.2*kk)+')';ctx.beginPath();ctx.arc(l.tx,l.ty,l.rad*(0.25+0.75*kk),0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,90,110,.7)';ctx.lineWidth=2;ctx.stroke()}
    ctx.fillStyle='rgba(40,20,80,.3)';ctx.beginPath();ctx.ellipse(l.x,l.y,l.anvil?14:6,l.anvil?6:3,0,0,TAU);ctx.fill();
    ctx.save();ctx.translate(l.x,l.y-l.h);ctx.rotate(l.anvil?0:l.t*14);
    if(l.kind==='block'){
      if(l.anvil){ctx.fillStyle='#4a4f7a';ctx.fillRect(-12,-6,24,9);ctx.fillRect(-6,3,12,7);ctx.fillRect(-17,-10,34,5);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(-17,-10,34,2)}
      else{ctx.fillStyle='#ff9a4d';ctx.fillRect(-9,-5.5,18,11);ctx.fillStyle='#ffd08a';ctx.fillRect(-9,-5.5,18,3);ctx.strokeStyle='#5a2b0a';ctx.lineWidth=1.5;ctx.strokeRect(-9,-5.5,18,11)}
    }else if(l.kind==='bottle'){ctx.fillStyle='#6ab58a';ctx.fillRect(-3.5,-6,7,12);ctx.fillStyle='#ff8a3c';ctx.fillRect(-1.5,-9,3,4)}
    else{ctx.fillStyle='#8aa545';ctx.beginPath();ctx.arc(0,0,5.5,0,TAU);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-1.5,-8,3,3)}
    ctx.restore();
  }
  // enemies
  for(let i=0;i<E.length;i++){const e=E[i];if(!e.dead&&vis(e.x,e.y))drawEnemy(e)}
  drawFields(1);
  // enemy bullets
  for(const b of EB){
    if(!vis(b.x,b.y))continue;
    const slowed=b.chr>0;
    ctx.fillStyle=slowed?'rgba(176,140,255,.38)':'rgba(255,90,110,.3)';ctx.beginPath();ctx.arc(b.x,b.y,b.r+(slowed?6:4),0,TAU);ctx.fill();
    ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
    ctx.strokeStyle=slowed?'rgba(214,190,255,.95)':'rgba(40,16,66,.85)';ctx.lineWidth=2;ctx.stroke();
  }
  // orbit blades + drones
  for(const w of SK.act){
    if(w.id==='orbit'){
      for(const b of w.bl){
        ctx.fillStyle='rgba(143,227,255,.22)';ctx.beginPath();ctx.arc(b.x,b.y,b.r+5,0,TAU);ctx.fill();
        ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a+Math.PI/2);
        ctx.fillStyle=w.evo?'#ffe9a0':'#cfefff';ctx.beginPath();ctx.moveTo(0,-b.r*1.6);ctx.lineTo(b.r*0.75,0);ctx.lineTo(0,b.r*1.6);ctx.lineTo(-b.r*0.75,0);ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-1.2,-b.r*0.9,2.4,b.r*1.8);ctx.restore();
      }
    }else if(w.id==='drone'){
      for(const d of w.dr){
        ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(d.x,d.y+10,6,3,0,0,TAU);ctx.fill();
        ctx.fillStyle='#2a3a1e';ctx.beginPath();ctx.arc(d.x,d.y,6.5,0,TAU);ctx.fill();
        ctx.fillStyle='#b8f06a';ctx.beginPath();ctx.arc(d.x,d.y,3,0,TAU);ctx.fill();
        const rr=now*40;ctx.strokeStyle='rgba(220,255,160,.6)';ctx.lineWidth=1.4;ctx.beginPath();
        for(let q=0;q<2;q++){const a=rr+q*Math.PI;ctx.moveTo(d.x+Math.cos(a)*9,d.y+Math.sin(a)*9);ctx.lineTo(d.x-Math.cos(a)*9,d.y-Math.sin(a)*9)}ctx.stroke();
      }
    }
  }
  // discs
  for(const d of DISC){
    ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);
    ctx.fillStyle=d.big?'#ffe08a':'#dfe8ee';ctx.beginPath();
    for(let i=0;i<8;i++){const a=i/8*TAU;ctx.lineTo(Math.cos(a)*d.r*1.1,Math.sin(a)*d.r*1.1);ctx.lineTo(Math.cos(a+TAU/16)*d.r*0.78,Math.sin(a+TAU/16)*d.r*0.78)}
    ctx.closePath();ctx.fill();ctx.fillStyle='#39454e';ctx.beginPath();ctx.arc(0,0,d.r*0.3,0,TAU);ctx.fill();ctx.restore();
  }
  // kickballs
  for(const b of BALLS){
    if(b.trail&&b.tr.length>3){
      for(let i=0;i<b.tr.length-2;i+=2){const a=i/b.tr.length;ctx.fillStyle='rgba(255,179,71,'+(0.35*a)+')';ctx.beginPath();ctx.arc(b.tr[i],b.tr[i+1],b.r*(0.4+0.6*a),0,TAU);ctx.fill()}
    }
    ctx.fillStyle='rgba(255,122,200,.28)';ctx.beginPath();ctx.arc(b.x,b.y,b.r+5,0,TAU);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.fillStyle=b.trail?'#ff8a3c':'#ff5fc0';
    ctx.beginPath();for(let i=0;i<5;i++){const a=i/5*TAU;ctx.lineTo(Math.cos(a)*b.r*0.5,Math.sin(a)*b.r*0.5)}ctx.closePath();ctx.fill();
    for(let i=0;i<5;i++){const a=i/5*TAU+TAU/10;ctx.beginPath();ctx.arc(Math.cos(a)*b.r*0.88,Math.sin(a)*b.r*0.88,b.r*0.2,0,TAU);ctx.fill()}
    ctx.restore();
    ctx.strokeStyle='rgba(40,16,66,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.stroke();
  }
  // bullets
  for(const b of B){
    if(!vis(b.x,b.y))continue;
    if(b.kind==='knife'){
      ctx.strokeStyle='rgba(110,215,255,.35)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(b.x-b.nx*8,b.y-b.ny*8);ctx.lineTo(b.x+b.nx*8,b.y+b.ny*8);ctx.stroke();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(b.x-b.nx*9,b.y-b.ny*9);ctx.lineTo(b.x+b.nx*9,b.y+b.ny*9);ctx.stroke();
    }else{
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,TAU);ctx.fill();
      ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(40,16,66,.6)';ctx.lineWidth=1.2;ctx.stroke();
    }
  }
  // lightning
  for(const bo of BOLT){
    const a=bo.t/bo.max;ctx.lineJoin='round';
    for(const pass of[[7,0.25],[2.6,1]]){
      ctx.strokeStyle=bo.col;ctx.globalAlpha=a*pass[1];ctx.lineWidth=pass[0];ctx.beginPath();
      for(let i=0;i<bo.pts.length-1;i++){
        const p=bo.pts[i],q=bo.pts[i+1];ctx.moveTo(p.x,p.y);
        const seg=5;for(let k=1;k<seg;k++){const t=k/seg;ctx.lineTo(p.x+(q.x-p.x)*t+Math.sin(k*7.1+i+bo.max*50)*7,p.y+(q.y-p.y)*t+Math.cos(k*5.3+i)*7)}
        ctx.lineTo(q.x,q.y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  // player
  drawBodies(now);
  // particles
  for(const f of FX){
    if(f.ty===0){ctx.globalAlpha=Math.max(0,f.life/f.max);ctx.fillStyle=f.col;ctx.fillRect(f.x-f.sz/2,f.y-f.sz/2,f.sz,f.sz)}
    else{ctx.globalAlpha=Math.max(0,f.life/f.tot)*0.9;ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.stroke()}
  }
  ctx.globalAlpha=1;
  // floating numbers
  ctx.textAlign='center';ctx.lineJoin='round';
  for(const f of FT){
    ctx.font=(f.big?'700 17px':'700 12px')+' "Barlow Semi Condensed",system-ui,sans-serif';
    ctx.globalAlpha=Math.min(1,f.life/f.max*1.6);ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.t,f.x,f.y);
  }
  ctx.globalAlpha=1;

  // screen space
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(vignette)ctx.drawImage(vignette,0,0,VW,VH);
  if(G.hurtFx>0){ctx.fillStyle='rgba(255,40,30,'+(0.28*G.hurtFx/0.35)+')';ctx.fillRect(0,0,VW,VH)}
  if(G.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(0.7,G.flash)+')';ctx.fillRect(0,0,VW,VH)}
  // chest pointer
  let ch=null,cd=1e9;for(const p of PK)if(p.k==='chest'){const d=Math.hypot(p.x-CAMP.x,p.y-CAMP.y);if(d<cd){cd=d;ch=p}}
  if(ch){
    const dx=(ch.x-CAMP.x)*SC,dy=(ch.y-CAMP.y)*SC;
    if(Math.abs(dx)>VW/2-14||Math.abs(dy)>VH/2-14){
      const m=Math.hypot(dx,dy),k=Math.min((VW/2-34)/Math.abs(dx||1e-6),(VH/2-90)/Math.abs(dy||1e-6)),px=VW/2+dx*k,py=VH/2+dy*k,a=Math.atan2(dy,dx);
      ctx.save();ctx.translate(px,py);ctx.rotate(a);ctx.fillStyle='#ffb52e';ctx.strokeStyle='#2b1b00';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-11);ctx.lineTo(-8,11);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore();
    }
  }
  // joystick
  const j=input.joy;
  if(j){
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(j.bx,j.by,54,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();
    const dx=j.x-j.bx,dy=j.y-j.by,d=Math.hypot(dx,dy),m=Math.min(d,54)/(d||1);
    ctx.fillStyle='rgba(255,181,46,.55)';ctx.beginPath();ctx.arc(j.bx+dx*m,j.by+dy*m,22,0,TAU);ctx.fill();
  }
}

const hudEl={xp:$('#xpfill'),lvl:$('#lvl'),kills:$('#kills'),gold:$('#rgold'),wave:$('#wave'),clock:$('#clock'),boss:$('#bossbar'),bossName:$('#bossname'),bossFill:$('#bossfill'),act:$('#sk-act'),pas:$('#sk-pas')};

function slotHtml(kind,id,l,evo){
  const X=kind==='act'?WEAPONS[id]:PASSIVES[id],mx=kind==='act'?MAXW:passMax(id);
  return '<div class="slot'+(evo?' evo':'')+(l>=mx?' max':'')+'" style="color:'+X.color+'" title="'+X.name+'">'+icon(X.icon)+'<em>'+(evo?'EVO':l)+'</em></div>';

/* mini map: a radar around the hero. The thin box is what the main screen shows. */
const mmEl=$('#mm'),mmc=mmEl?mmEl.getContext('2d'):null,MM_RANGE=640;
const MM_COL={walker:'#b7f04a',runner:'#ffb23d',brute:'#c58bff',spitter:'#3de0c8',bomber:'#ff5d5d',bat:'#ff7ad9',elite:'#ffd23d',boss:'#ff3b5c'};
function drawMini(){
  if(!mmc)return;
  const S=mmEl.clientWidth||100,D=Math.min(window.devicePixelRatio||1,2),W=Math.round(S*D);
  if(mmEl.width!==W){mmEl.width=W;mmEl.height=W}
  const c=mmc;c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,S,S);
  const R=S/2-3,cx=S/2,cy=S/2,k=R/MM_RANGE,now=G.t;
  c.fillStyle='rgba(11,19,69,.8)';c.beginPath();c.arc(cx,cy,R+1.5,0,TAU);c.fill();
  c.save();c.beginPath();c.arc(cx,cy,R,0,TAU);c.clip();
  c.strokeStyle='rgba(130,150,255,.2)';c.lineWidth=1;c.beginPath();c.arc(cx,cy,R*0.5,0,TAU);c.moveTo(cx,cy-R);c.lineTo(cx,cy+R);c.moveTo(cx-R,cy);c.lineTo(cx+R,cy);c.stroke();
  c.strokeStyle='rgba(255,255,255,.34)';c.lineWidth=1;c.strokeRect(cx-HVW*k,cy-HVH*k,HVW*2*k,HVH*2*k);
  /* pickups */
  for(const p of PK){
    const dx=(p.x-CAMP.x)*k,dy=(p.y-CAMP.y)*k;if(dx*dx+dy*dy>R*R)continue;
    if(p.k==='chest'){c.fillStyle='#ffc933';c.fillRect(cx+dx-3,cy+dy-3,6,6);c.strokeStyle='#2b1b00';c.lineWidth=1;c.strokeRect(cx+dx-3,cy+dy-3,6,6)}
    else if(p.k==='coin')continue;
    else{c.fillStyle=p.k==='hp'?'#ff6b6b':p.k==='magnet'?'#c5a3ff':'#ffffff';c.beginPath();c.arc(cx+dx,cy+dy,2.2,0,TAU);c.fill()}
  }
  /* enemies */
  for(let i=0;i<E.length;i++){
    const e=E[i];if(e.dead)continue;
    const dx=(e.x-CAMP.x)*k,dy=(e.y-CAMP.y)*k;if(dx*dx+dy*dy>R*R)continue;
    if(e.k==='boss'){const pu=1+0.25*Math.sin(now*8);c.fillStyle=MM_COL.boss;c.beginPath();c.arc(cx+dx,cy+dy,4.6*pu,0,TAU);c.fill();c.strokeStyle='#fff';c.lineWidth=1.2;c.stroke()}
    else if(e.k==='elite'){c.fillStyle=MM_COL.elite;c.beginPath();c.arc(cx+dx,cy+dy,3.2,0,TAU);c.fill();c.strokeStyle='#2b1b00';c.lineWidth=1;c.stroke()}
    else{c.fillStyle=MM_COL[e.k]||'#fff';const z=e.k==='brute'?3:2;c.fillRect(cx+dx-z/2,cy+dy-z/2,z,z)}
  }
  c.restore();
  /* boss + chest arrows on the rim when they are off the radar */
  const edge=(x,y,col,sz)=>{
    const dx=(x-CAMP.x)*k,dy=(y-CAMP.y)*k,d=Math.hypot(dx,dy);if(d<=R)return;
    const a=Math.atan2(dy,dx),ex=cx+Math.cos(a)*(R-1),ey=cy+Math.sin(a)*(R-1);
    c.save();c.translate(ex,ey);c.rotate(a);c.fillStyle=col;c.strokeStyle='#1d1042';c.lineWidth=1.2;c.beginPath();c.moveTo(sz,0);c.lineTo(-sz*0.7,-sz*0.8);c.lineTo(-sz*0.7,sz*0.8);c.closePath();c.fill();c.stroke();c.restore();
  };
  if(G.boss&&!G.boss.dead)edge(G.boss.x,G.boss.y,MM_COL.boss,5);
  let ch=null,cd=1e9;for(const p of PK)if(p.k==='chest'){const d=Math.hypot(p.x-CAMP.x,p.y-CAMP.y);if(d<cd){cd=d;ch=p}}
  if(ch)edge(ch.x,ch.y,'#ffc933',4);
  /* hero */
  if(G.co){for(let i=0;i<G.np;i++){const b=PL[i];if(b.gone)continue;const dx=(b.x-CAMP.x)*k,dy=(b.y-CAMP.y)*k;c.save();c.translate(cx+dx,cy+dy);c.rotate(b.face);c.globalAlpha=b.dead?0.4:1;c.fillStyle=P_COL[i];c.strokeStyle='#fff';c.lineWidth=1.4;c.beginPath();c.moveTo(5.5,0);c.lineTo(-3.5,-3.8);c.lineTo(-1.5,0);c.lineTo(-3.5,3.8);c.closePath();c.fill();c.stroke();c.restore()}}
  else{c.save();c.translate(cx,cy);c.rotate(P.face);c.fillStyle=HEROES[SAVE.hero].color;c.strokeStyle='#fff';c.lineWidth=1.4;c.beginPath();c.moveTo(5.5,0);c.lineTo(-3.5,-3.8);c.lineTo(-1.5,0);c.lineTo(-3.5,3.8);c.closePath();c.fill();c.stroke();c.restore()}
  c.strokeStyle='#ffc933';c.lineWidth=2;c.beginPath();c.arc(cx,cy,R+1.5,0,TAU);c.stroke();
}
function hudTick(){
  const st=G.stage;
  hudEl.xp.style.width=(G.xp/G.need*100).toFixed(1)+'%';
  setT('lvl',hudEl.lvl,'LV '+G.lvl);
  setT('kills',hudEl.kills,String(G.kills));
  setT('gold',hudEl.gold,String(G.gold));
  setT('wave',hudEl.wave,'WAVE '+G.wave+'/'+st.waves);
  const ot=G.wave===st.waves&&G.waveT>st.waveLen;
  setT('clock',hudEl.clock,fmtTime(G.t)+(ot?' · OVERTIME':''));
  const b=G.boss;
  if(b&&!b.dead){
    if(hudEl.boss.hidden){hudEl.boss.hidden=false;hudEl.bossName.textContent=BOSSES[b.boss].name.toUpperCase()}
    hudEl.bossFill.style.width=Math.max(0,b.hp/b.maxhp*100).toFixed(1)+'%';
  }else if(!hudEl.boss.hidden)hudEl.boss.hidden=true;
  if(G.dirty){hudEl.act.innerHTML=skillsHtml('act');hudEl.pas.innerHTML=skillsHtml('pas');G.dirty=false}
  drawMini();
}

function reviveHtml(){

function showResult(won){
  if(G.resultDone)return;G.resultDone=true;G.dead=true;G.paused=true;
  if(G.net==='host')netEnd(won);
  const r=finishRun(won),st=G.stage;
  const next=won&&STAGES[st.id]&&true,last=won&&!STAGES[st.id];
  const crate=r.crate?'<div class="drop">'+crateSvg(['scrap','vanguard','prime'].indexOf(r.crate),46)+'<span><b>Free '+CASE_BY[r.crate].name+'</b><small>First clear reward. Open it in the Shop.</small></span></div>':'';
  openModal('<div class="sheet"><h2 class="'+(won?'':'red')+'">'+(won?'LEVEL CLEARED':'YOU FELL')+'</h2><div class="sub">'+st.name+' · Level '+st.id+' · '+st.tierName+'</div>'+
   '<div class="stats"><div><span>Time</span><b class="num">'+fmtTime(G.t)+'</b></div><div><span>Wave</span><b class="num">'+G.wave+'/'+st.waves+'</b></div><div><span>Kills</span><b class="num">'+G.kills+'</b></div><div><span>Level</span><b class="num">'+G.lvl+'</b></div>'+
   '<div><span>Gold earned</span><b class="num" style="color:var(--sign)">+'+r.gold+'</b></div><div><span>Gems earned</span><b class="num" style="color:var(--ice)">+'+r.gems+'</b></div></div>'+
   crate+buildStrip()+
   (last?'<div class="note">All 15 levels cleared. Nicely done. Replay any level for gold and gems.</div>':'')+
   (G.net==='guest'?'<div class="note">The host chooses the next level. Stay here, or go Home and wait.</div><div class="row"><button class="btn ghost" data-act="home">Home</button></div>':
   '<div class="row"><button class="btn ghost" data-act="home">Home</button><button class="btn" data-act="retry">'+(won?'Play again':'Retry')+'</button></div>'+
   (next?'<button class="btn big" data-act="nextch">Next level</button>':''))+'</div>');
  sfx(won?'evolve':'die');
}

modalEl.addEventListener('click',e=>{
  const sh=e.target.closest('[data-shop]');
  if(sh){shopAction(sh);return}
  const pk=e.target.closest('[data-pick]');
  if(pk&&G&&G.opts){pickOption(+pk.dataset.pick);return}
  const b=e.target.closest('[data-act]');if(!b||!G)return;
  switch(b.dataset.act){
    case 'refresh':doRefresh();break;
    case 'collect':sfx('click');resume();break;
    case 'resume':sfx('click');G.quitArm=false;resume();break;
    case 'sound':SAVE.mute=!SAVE.mute;persist();ensureAudio();openModal(pauseHtml());syncSound();break;
    case 'quit':if(G.quitArm){G.quitArm=false;G.paused=true;showResult(false)}else{G.quitArm=true;openModal(pauseHtml())}break;
    case 'revive':doRevive();break;
    case 'giveup':showResult(false);break;
    case 'home':leaveRun();break;
    case 'retry':{const id=G.stage.id,o=reOpts();closeModal();startRun(id,o);break}
    case 'nextch':{ui.stage=Math.min(STAGES.length,G.stage.id+1);const id=ui.stage,o=reOpts();closeModal();startRun(id,o);break}
    case 'leavenet':{closeModal();netLeave();leaveRun();break}
  }
});

function crateCard(C,i){
  const free=SAVE.free[C.id]||0,cur=C.cur==='gold'?'coin':'gem';
  const pity=C.pity?'<div class="pity">'+RARITY[C.pity.r].name+' or better guaranteed in <b class="num">'+(C.pity.n-(SAVE.pity[C.id]||0))+'</b> '+((C.pity.n-(SAVE.pity[C.id]||0))===1?'crate':'crates')+'</div>':'';
  const one=free>0?'OPEN FREE <span class="num">×'+free+'</span>':icon(cur)+' '+fmtNum(C.cost)+' · OPEN';
  const five=icon(cur)+' '+fmtNum(needPaid(C,5))+' · ×5';
  return '<div class="crate-card" style="--rc:'+RARITY[C.rar].col+'"><div class="cc-top"><div class="cbox">'+crateSvg(i,84)+'</div><div class="mt"><b>'+C.name+'</b><small>'+C.desc+'</small>'+(free>0?'<span class="freebadge">'+free+' FREE</span>':'')+'</div></div>'+oddsHtml(C)+pity+
    '<div class="row"><button class="btn" data-act="open" data-id="'+C.id+'"'+(canOpenN(C,1)?'':' disabled')+'>'+one+'</button><button class="btn ghost" data-act="open5" data-id="'+C.id+'"'+(canOpenN(C,5)?'':' disabled')+'>'+five+'</button></div></div>';
}
function tabShop(){
  let found=0;for(const sl of SLOTS)for(let r=0;r<5;r++)if(SAVE.inv[sl.id+r])found++;
  const note=SAVE.note?'<div class="panel notice"><span>'+SAVE.note+'</span><button class="icon-btn" data-act="dismissnote" aria-label="Dismiss">'+icon('chev').replace('<svg','<svg style="transform:rotate(180deg)"')+'</button></div>':'';
  return '<div class="col">'+note+'<h3 class="h3">CRATES · '+found+'/25 ARMOR FOUND</h3>'+CASES.map(crateCard).join('')+
    '<div class="note">Every crate holds one piece of armor for a random slot. Win a level for the first time to earn a free crate: Easy gives a Scrap Crate, Medium a Vanguard Crate, Hard a Prime Crate.</div></div>';
}
function tabTalent(){
  let t='';
  for(const T of TALENTS){
    const l=SAVE.talents[T.id],maxed=l>=T.max,cost=talentCost(T,l);
    t+='<div class="tal"><span class="ico">'+icon(T.icon)+'</span><div><b>'+T.name+' <span class="dim num" style="font-weight:600;font-size:13px">'+l+'/'+T.max+'</span></b><small>'+(l?T.text(l):'No bonus yet')+(maxed?'':' <span class="nx">→ '+T.text(l+1)+'</span>')+'</small><div class="meter"><i style="width:'+(l/T.max*100)+'%"></i></div></div>'+
     '<button class="btn sm" data-act="tal" data-id="'+T.id+'"'+(maxed||SAVE.gold<cost?' disabled':'')+'>'+(maxed?'MAX':icon('coin')+' '+fmtNum(cost))+'</button></div>';
  }
  return '<div class="col">'+statsPanel()+'<h3 class="h3">TALENTS · PERMANENT BONUSES</h3>'+t+'</div>';
}
function tabHero(){
  let h='';
  for(const id in HEROES){
    const H=HEROES[id],own=!!SAVE.heroes[id],sel=SAVE.hero===id;
    h+='<div class="hc'+(sel?' sel':'')+'"><canvas class="portrait" data-hero="'+id+'" width="144" height="144"></canvas><div><b>'+H.name+'</b><small>'+H.title+' · '+H.bonus+'</small><span class="wp" style="color:'+WEAPONS[H.start].color+'">'+icon(WEAPONS[H.start].icon)+' '+WEAPONS[H.start].name+'</span></div>'+
     (sel?'<button class="btn sm ghost" disabled>ACTIVE</button>':own?'<button class="btn sm" data-act="hero" data-id="'+id+'">SELECT</button>':'<button class="btn sm" data-act="buyhero" data-id="'+id+'"'+(SAVE.gems<H.cost?' disabled':'')+'>'+icon('gem')+' '+H.cost+'</button>')+'</div>';
  }
  return '<div class="col"><h3 class="h3">HEROES</h3><div class="heroes">'+h+'</div><div class="note">Gems come from bosses and clearing levels. Your armor shows on every hero.</div>'+
   '<button class="btn ghost sm" data-act="reset" style="justify-self:center">'+(ui.resetArm?'Tap again to erase all progress':'Reset progress')+'</button></div>';
}
function renderHub(){
  updateChips();syncSound();
  $('#tabs').innerHTML=TABS.map(t=>'<button class="tab'+(t[0]==='battle'?' go':'')+'" style="--tc:'+t[3]+'" role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+icon(t[2])+'<span>'+t[1]+'</span></button>').join('');
  const body=$('#hub-body'),top=body.scrollTop;
  const lobby=!!ui.lobby;$('#tabs').style.display=lobby?'none':'';
  body.innerHTML=lobby?tabLobby():({battle:tabBattle,armor:tabArmor,shop:tabShop,talent:tabTalent,hero:tabHero})[ui.tab]();
  body.scrollTop=top;
  body.querySelectorAll('canvas.portrait').forEach(c=>{
    const g=c.getContext('2d');if(!g)return;
    g.clearRect(0,0,c.width,c.height);
    drawHero(g,c.width/2-c.width*0.02,c.height/2+c.width*0.04,c.width/50,-0.5,HEROES[c.dataset.hero].color,1,{id:c.dataset.hero,t:1.3});
  });
}

/* ---------- armor swap sheet + crate opening ---------- */
function swapHtml(slot){
  const sl=SLOT_BY[slot],cur=equipped(slot);let rows='';
  for(let r=4;r>=0;r--){
    const l=SAVE.inv[slot+r],R=RARITY[r];
    if(l){
      const on=cur&&cur.r===r;
      rows+='<div class="arm sm'+(on?' on':'')+'" style="--rc:'+R.col+'"><div class="abox r'+r+'">'+armorSvg(slot,r,54)+'</div><div class="mt"><b>'+armorName(slot,r)+'</b><span class="rr">'+R.name.toUpperCase()+' · LV '+l+'/'+ARMOR_MAX+'</span><span class="st"><span>'+armorStats(slot,r,l).map(x=>x.name+' <b class="num">'+x.text+'</b>').join(' · ')+'</span></span></div><div class="acts">'+(on?'<button class="btn sm ghost" disabled>WORN</button>':'<button class="btn sm" data-shop="equip" data-slot="'+slot+'" data-r="'+r+'">WEAR</button>')+'</div></div>';
    }else rows+='<div class="arm sm lockd" style="--rc:'+R.col+'"><div class="abox r'+r+'">'+armorSvg(slot,r,54)+'</div><div class="mt"><b>'+armorName(slot,r)+'</b><span class="rr dim">'+R.name.toUpperCase()+' · NOT FOUND</span><span class="st dim">Open crates to find it.</span></div><div class="acts"></div></div>';
  }
  return '<div class="sheet"><h2>'+sl.name.toUpperCase()+'</h2><div class="sub">Pick which one to wear</div>'+rows+'<button class="btn ghost" data-shop="close">Close</button></div>';
}
function resultHtml(res){
  const R=RARITY[res.r],stt=armorStats(res.slot,res.r,res.level);
  const tag=res.isNew?'<span class="tg new">NEW!</span>':res.maxed?'<span class="tg">ALREADY MAX · +'+res.gold+' GOLD</span>':'<span class="tg up">DUPLICATE · LEVEL '+res.level+'</span>';
  return '<div class="res" style="--rc:'+R.col+'"><div class="rglow"></div><div class="rart">'+armorSvg(res.slot,res.r,132)+'</div><div class="rn">'+armorName(res.slot,res.r)+'</div><div class="rr">'+R.name.toUpperCase()+' '+SLOT_BY[res.slot].name.toUpperCase()+' · LV '+res.level+'</div>'+tag+
    '<div class="rst">'+stt.map(x=>'<span>'+x.name+' <b class="num">'+x.text+'</b></span>').join('')+'</div>'+(res.equipped?'<div class="eqd">EQUIPPED</div>':'')+(res.forced?'<div class="eqd pity">PITY BONUS</div>':'')+'</div>';
}
function tileRoll(C){
  let tot=0;for(const o of C.odds)tot+=o;let x=Math.random()*tot,r=0;
  for(let i=0;i<C.odds.length;i++){x-=C.odds[i];if(x<0){r=i;break}}
  return{slot:SLOTS[(Math.random()*SLOTS.length)|0].id,r};
}
const ROLL_N=46,ROLL_WIN=38,TILE_STEP=72;
let rollTok=0;
function rollHtml(id,res){
  const C=CASE_BY[id],tiles=[];
  for(let i=0;i<ROLL_N;i++)tiles.push(i===ROLL_WIN?{slot:res.slot,r:res.r}:tileRoll(C));
  if(res.r<4&&Math.random()<0.5)tiles[ROLL_WIN+1]={slot:SLOTS[(Math.random()*5)|0].id,r:Math.min(4,res.r+1+((Math.random()*2)|0))};
  const th=t=>'<div class="tile r'+t.r+'" style="--rc:'+RARITY[t.r].col+'">'+armorSvg(t.slot,t.r,54)+'</div>';
  const again=canOpen(id)?'<button class="btn" data-shop="again" data-id="'+id+'" data-n="1">'+(SAVE.free[id]>0?'OPEN FREE ×'+SAVE.free[id]:icon(C.cur==='gold'?'coin':'gem')+' '+fmtNum(C.cost)+' · AGAIN')+'</button>':'';
  return '<div class="sheet roller"><h2>'+C.name.toUpperCase()+'</h2><div class="roll"><div class="strip">'+tiles.map(th).join('')+'</div><i class="mark"></i></div>'+
    '<div class="pre row"><button class="btn ghost" data-shop="skip">Skip</button></div>'+
    '<div class="after"><div class="resbox">'+resultHtml(res)+'</div><div class="row">'+again+'<button class="btn ghost" data-shop="done">Done</button></div></div></div>';
}
function finishRoll(res){
  const sh=modalEl.querySelector('.roller');if(!sh||sh.classList.contains('done'))return;
  sh.classList.add('done');
  sfx(res.r>=3?'evolve':res.r>=2?'chest':'up');
  updateChips();
}
function runRoll(res){
  const tok=++rollTok,strip=modalEl.querySelector('.strip'),roll=modalEl.querySelector('.roll');if(!strip||!roll)return;
  modalEl.dataset.roll=tok;
  const cw=roll.clientWidth||340,jit=(Math.random()-0.5)*34;
  const target=-(ROLL_WIN*TILE_STEP+27+jit-cw/2);
  let last=-1;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(rollTok!==tok)return;
    strip.style.transition='transform 4.6s cubic-bezier(.08,.62,.1,1)';strip.style.transform='translateX('+target+'px)';
    const t0=performance.now();
    const tick=()=>{
      if(rollTok!==tok||!modalEl.querySelector('.roller'))return;
      const m=getComputedStyle(strip).transform;let tx=0;if(m&&m!=='none'){const mm=m.match(/matrix\(([^)]+)\)/);if(mm)tx=parseFloat(mm[1].split(',')[4])||0}
      const idx=Math.floor((-tx+cw/2)/TILE_STEP);if(idx!==last){last=idx;sfx('tick')}
      if(performance.now()-t0<4900)requestAnimationFrame(tick);else finishRoll(res);
    };
    requestAnimationFrame(tick);
  }));
}
function skipRoll(res){
  const strip=modalEl.querySelector('.strip'),roll=modalEl.querySelector('.roll');if(!strip||!roll)return;
  const cw=roll.clientWidth||340;rollTok++;
  strip.style.transition='none';strip.style.transform='translateX('+(-(ROLL_WIN*TILE_STEP+27-cw/2))+'px)';
  finishRoll(res);
}
let lastRes=null;
function multiHtml(id,list){
  const C=CASE_BY[id];
  const cards=list.map((r,i)=>{const R=RARITY[r.r];
    const tag=r.isNew?'NEW':r.maxed?'MAX +'+r.gold+'g':'LV '+r.level;
    return '<div class="mres r'+r.r+'" style="--rc:'+R.col+';animation-delay:'+(0.12+i*0.32)+'s"><div class="abox r'+r.r+'">'+armorSvg(r.slot,r.r,62)+'</div><b>'+armorName(r.slot,r.r)+'</b><span class="rr">'+R.name.toUpperCase()+'</span><span class="tg'+(r.isNew?' new':'')+'">'+tag+'</span></div>'}).join('');
  const again=canOpenN(C,5)?'<button class="btn" data-shop="again" data-id="'+id+'" data-n="5">'+icon(C.cur==='gold'?'coin':'gem')+' '+fmtNum(needPaid(C,5))+' · ×5 AGAIN</button>':'';
  return '<div class="sheet"><h2>'+C.name.toUpperCase()+' ×'+list.length+'</h2><div class="mgrid">'+cards+'</div><div class="row">'+again+'<button class="btn ghost" data-shop="done">Done</button></div></div>';
}
function startOpen(id,n){
  const C=CASE_BY[id];if(!C)return false;ensureAudio();
  if(n>1){
    if(!canOpenN(C,n)){sfx('die');return false}
    const list=[];for(let i=0;i<n;i++){const r=openCrate(id);if(!r)break;list.push(r)}
    if(!list.length)return false;
    updateChips();openModal(multiHtml(id,list));
    list.forEach((r,i)=>setTimeout(()=>{if(modalEl.querySelector('.mgrid'))sfx(r.r>=3?'evolve':r.r>=2?'chest':'up')},200+i*320));
    return list;
  }
  const res=openCrate(id);if(!res){sfx('die');return false}
  lastRes=res;updateChips();
  openModal(rollHtml(id,res));runRoll(res);sfx('click');
  return res;
}
function shopAction(el){
  ensureAudio();
  switch(el.dataset.shop){
    case 'close':case 'done':rollTok++;closeModal();renderHub();sfx('click');break;
    case 'equip':SAVE.eq[el.dataset.slot]=+el.dataset.r;persist();sfx('up');closeModal();renderHub();break;
    case 'skip':if(lastRes)skipRoll(lastRes);break;
    case 'again':rollTok++;startOpen(el.dataset.id,+el.dataset.n||1);break;
  }
}
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return;ui.tab=t.dataset.tab;ui.resetArm=false;ensureAudio();sfx('click');renderHub()});
$('#btn-sound').addEventListener('click',()=>{SAVE.mute=!SAVE.mute;persist();ensureAudio();syncSound();sfx('click')});
$('#hub-body').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id;ensureAudio();
  switch(b.dataset.act){
    case 'rebirth':{
      if(!rbReady())break;
      if(!ui.rbConfirm){ui.rbConfirm=true;sfx('click');renderHub();clearTimeout(ui.rbT);ui.rbT=setTimeout(()=>{ui.rbConfirm=false;if(state==='hub')renderHub()},6000);break}
      clearTimeout(ui.rbT);ui.rbConfirm=false;
      SAVE.rebirth=(SAVE.rebirth|0)+1;SAVE.stages={};SAVE.gold=400;ui.stage=1;
      SAVE.note='REBIRTH! You are rank '+SAVE.rebirth+': +'+Math.round(RB_PER.dmg*SAVE.rebirth*100)+'% damage, +'+Math.round(RB_PER.hp*SAVE.rebirth*100)+'% max HP, +'+Math.round(RB_PER.gold*SAVE.rebirth*100)+'% gold. Zombies are tougher and clear rewards are bigger.';
      persist();sfx('evolve');renderHub();window.scrollTo&&window.scrollTo(0,0);break}
    case 'rebirth-cancel':clearTimeout(ui.rbT);ui.rbConfirm=false;sfx('click');renderHub();break;
    case 'stage':ui.stage=+id;sfx('click');netPick();renderHub();break;
    case 'start':sfx('click');startRun(ui.stage,startOpts());break;
    case 'net-host':sfx('click');ui.lobby=true;renderHub();break;
    case 'net-create':sfx('click');netHost();break;
    case 'lobby-back':sfx('click');netLeave();ui.lobby=false;renderHub();break;
    case 'net-join':sfx('click');netJoin(ui.joinCode);break;
    case 'net-leave':sfx('click');netLeave();break;
    case 'coop':SAVE.coop=!SAVE.coop;persist();sfx('click');renderHub();break;
    case 'hero2':SAVE.hero2=id;persist();sfx('click');renderHub();break;
    case 'top5':ui.top5=!ui.top5;sfx('click');renderHub();break;
    case 'tab':ui.tab=id;sfx('click');renderHub();break;
    case 'up':{const it=equipped(id);if(!it||it.l>=ARMOR_MAX)break;const c=armorUpCost(it.r,it.l);if(SAVE.gold>=c){SAVE.gold-=c;SAVE.inv[id+it.r]=it.l+1;persist();sfx('up');renderHub()}break}
    case 'swap':sfx('click');openModal(swapHtml(id));break;
    case 'open':startOpen(id,1);break;
    case 'open5':startOpen(id,5);break;
    case 'dismissnote':SAVE.note='';persist();renderHub();break;
    case 'tal':{const T=TALENTS.find(x=>x.id===id),l=SAVE.talents[id],c=talentCost(T,l);if(SAVE.gold>=c&&l<T.max){SAVE.gold-=c;SAVE.talents[id]=l+1;persist();sfx('up');renderHub()}break}
    case 'hero':SAVE.hero=id;persist();sfx('click');renderHub();break;
    case 'buyhero':{const H=HEROES[id];if(SAVE.gems>=H.cost){SAVE.gems-=H.cost;SAVE.heroes[id]=1;SAVE.hero=id;persist();sfx('evolve');renderHub()}break}
    case 'reset':if(ui.resetArm){SAVE=defaultSave();persist();ui.resetArm=false;ui.stage=1;sfx('click');renderHub()}else{ui.resetArm=true;renderHub()}break;
  }
});

$('#hub-body').addEventListener('input',e=>{if(e.target&&e.target.id==='netcode'){const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);if(v!==e.target.value)e.target.value=v;ui.joinCode=v}});
$('#hub-body').addEventListener('keydown',e=>{if(e.target&&e.target.id==='netcode'&&e.key==='Enter'){e.preventDefault();netJoin(ui.joinCode)}});
/* ---------- boot + loop ---------- */
let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;
  if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  if(state==='run'&&G){
    if(G.net==='guest')guestFrame(dt);
    else{
      if(!G.paused)update(dt);
      render();hudTick();
      if(G.net==='host')netTick(dt);
    }
  }
}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(cv);
resize();renderHub();
requestAnimationFrame(frame);


})();

</script>
</body></html>
